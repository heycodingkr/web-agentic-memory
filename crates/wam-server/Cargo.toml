[package]
name = "wam-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Axum HTTP adapter and injectable application services for WAM"
default-run = "wam-server"

[dependencies]
async-trait.workspace = true
axum.workspace = true
base64 = "0.22"
getrandom = "0.4"
fs2 = "0.4"
futures-util = "0.3"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
reqwest.workspace = true
redis = { version = "0.32.7", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls-webpki-roots", "connection-manager", "script"] }
serde.workspace = true
sha2 = "0.10"
subtle = "2.6"
url.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.32.1", features = ["bundled"] }
tokio.workspace = true
wam-contracts.workspace = true
wam-core.workspace = true
wam-gatekeeper.workspace = true
wam-client.workspace = true
wam-mcp.workspace = true

[dev-dependencies]
http-body-util = "0.1"
tower.workspace = true
