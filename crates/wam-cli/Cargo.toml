[package]
name = "wam-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Small command-line adapter over the shared WAM API client"

[[bin]]
name = "wam"
path = "src/main.rs"

[dependencies]
clap.workspace = true
getrandom = "0.4"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "time"] }
wam-client.workspace = true
wam-contracts.workspace = true
wam-core.workspace = true
url.workspace = true

[dev-dependencies]
async-trait.workspace = true
tokio = { workspace = true, features = ["test-util", "time"] }
