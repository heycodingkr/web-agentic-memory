<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gridwise — Monthly budget</title>
<!--
  Demo spreadsheet used for the recorded landing-page videos. Stand-alone: no network, no real account, all
  artwork is drawn here. Quirks it reproduces, the ones agents trip over in web spreadsheets: cells are not inputs
  (select a cell, then type to replace what is in it), Tab moves right and Enter returns to the column where the Tab
  run started, a formula needs a leading "=" (SUM(B2:C2) alone is plain text), and autosave trails the last edit.
-->
<style>
  :root {
    --ink: #1b2a22; --muted: #76837b; --line: #e0e6e2; --paper: #ffffff; --bg: #eef3ef;
    --accent: #1b8f5a; --accent-soft: #e1f3e9; --ok: #1f8a5b; --warn: #c2410c;
    --sans: -apple-system, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; overflow: hidden; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--sans); }
  button { font: inherit; cursor: pointer; }

  .bar { flex: none; display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 20px; background: var(--paper); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: -.02em; }
  .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
  .logo svg { width: 16px; height: 16px; }
  .title { padding: 0 10px; font-weight: 600; font-size: 16px; }
  .spacer { flex: 1; }
  .status { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; white-space: nowrap; }
  .status i { width: 9px; height: 9px; border-radius: 50%; background: #c3cbc6; }
  .status.saved i { background: var(--ok); }
  .status.saving i { background: #e8a317; animation: pulse .7s ease-in-out infinite alternate; }
  @keyframes pulse { to { opacity: .3; } }
  .chip { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 999px; background: #f0f4f1; color: #55645b; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
  .chip svg { width: 14px; height: 14px; }
  .btn { height: 38px; padding: 0 18px; border-radius: 9px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-weight: 600; font-size: 15px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .42; cursor: not-allowed; }

  .fbar { flex: none; display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 20px; background: var(--paper); border-bottom: 1px solid var(--line); }
  .namebox { width: 70px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 7px; background: #f7faf8; font: 600 14px var(--sans); }
  .fx { color: var(--muted); font: italic 600 15px Georgia, serif; }
  .ftext { flex: 1; min-width: 0; height: 30px; display: flex; align-items: center; padding: 0 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); font: 500 15px ui-monospace, "SF Mono", Menlo, monospace; white-space: nowrap; overflow: hidden; }

  .work { flex: 1; min-height: 0; overflow: auto; padding: 0 20px 20px; scrollbar-width: none; }
  .work::-webkit-scrollbar { display: none; }
  .grid { position: relative; display: grid; grid-template-columns: 48px 160px repeat(5, 122px); grid-auto-rows: 38px; width: max-content; margin-top: 16px; border: 1px solid #cfd8d3; border-radius: 6px; background: var(--paper); user-select: none; -webkit-user-select: none; }
  .grid > div { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .grid > .h { display: grid; place-items: center; background: #f4f7f5; color: #5f6e65; font: 600 13px var(--sans); }
  .grid > .h.on { background: var(--accent-soft); color: var(--accent); }
  .grid > .corner { grid-row: 1; }
  .grid > .col { grid-row: 1; height: 32px; }
  .grid > .c { position: relative; display: flex; align-items: center; padding: 0 12px; font: 500 17px var(--sans); white-space: nowrap; overflow: hidden; }
  .grid > .c.num { justify-content: flex-end; font-variant-numeric: tabular-nums; }
  .grid > .c.err { color: var(--warn); font-weight: 700; }
  .grid > .c.sel { outline: 2.5px solid var(--accent); outline-offset: -2px; z-index: 2; }
  .grid > .c.sel::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 8px; height: 8px; background: var(--accent); border: 1.5px solid #fff; border-radius: 2px; }
  .editor { position: absolute; z-index: 5; margin: 0; padding: 0 11px; border: 2.5px solid var(--accent); border-radius: 0; background: var(--paper); color: var(--ink); font: 500 17px ui-monospace, "SF Mono", Menlo, monospace; outline: 0; box-shadow: 0 6px 18px rgba(27, 42, 34, .18); }
  .editor[hidden] { display: none; }
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><span class="logo"><svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.2" y="2.2" width="11.6" height="11.6" rx="1.8"/><path d="M2.2 6.6h11.6M2.2 10.2h11.6M6.6 2.2v11.6"/></svg></span>Gridwise</div>
  <span class="title">Monthly budget</span>
  <div class="spacer"></div>
  <span id="status" class="status"><i></i><span id="statusText">Ready · autosaves</span></span>
  <span class="chip"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="10" height="7" rx="1.8"/><path d="M5.2 7V5a2.8 2.8 0 0 1 5.6 0v2"/></svg>Only you</span>
  <button class="btn primary" type="button" disabled title="Sharing is turned off in this demo">Share</button>
</header>
<div class="fbar">
  <span id="nameBox" class="namebox">A1</span>
  <span class="fx">fx</span>
  <div id="formulaText" class="ftext"></div>
</div>
<main class="work">
  <div id="grid" class="grid" role="grid" aria-label="Spreadsheet"><input id="editor" class="editor" type="text" hidden aria-label="Cell editor" spellcheck="false" autocomplete="off"></div>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const COLS = 6, ROWS = 12;
  const grid = $('grid'), editor = $('editor'), status = $('status'), statusText = $('statusText');
  const raw = {}, els = {}, colHeads = [], rowHeads = [];
  let sel = { r: 0, c: 0 }, editing = false, tabCol = null, saveTimer = 0, saved = null;
  const addr = (r, c) => String.fromCharCode(65 + c) + (r + 1);

  const make = (cls, text) => { const d = document.createElement('div'); d.className = cls; if (text !== undefined) d.textContent = text; return d; };
  grid.appendChild(make('h corner'));
  for (let c = 0; c < COLS; c++) { const h = make('h col', String.fromCharCode(65 + c)); colHeads.push(h); grid.appendChild(h); }
  for (let r = 0; r < ROWS; r++) {
    const h = make('h', String(r + 1)); rowHeads.push(h); grid.appendChild(h);
    for (let c = 0; c < COLS; c++) {
      const cell = make('c'); cell.dataset.cell = addr(r, c); cell.setAttribute('role', 'gridcell');
      els[addr(r, c)] = cell; grid.appendChild(cell);
    }
  }

  // ---- values: numbers, text, and =SUM(range) ---------------------------------------------------------------
  function value(a, seen = []) {
    const t = (raw[a] ?? '').trim();
    if (t.startsWith('=')) {
      const m = /^=SUM\(([A-F])(\d+):([A-F])(\d+)\)$/i.exec(t);
      if (!m || seen.includes(a)) return { err: m ? '#REF!' : '#NAME?' };
      const [c1, c2] = [m[1].toUpperCase().charCodeAt(0) - 65, m[3].toUpperCase().charCodeAt(0) - 65].sort((x, y) => x - y);
      const [r1, r2] = [+m[2] - 1, +m[4] - 1].sort((x, y) => x - y);
      let total = 0;
      for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) { const v = value(addr(r, c), [...seen, a]); if (typeof v.n === 'number') total += v.n; }
      return { n: total };
    }
    if (/^-?[\d,]*\.?\d+$/.test(t)) return { n: Number(t.replace(/,/g, '')) };
    return { s: t };
  }
  const shown = (a) => { const v = value(a); return 'err' in v ? v.err : 'n' in v ? v.n.toLocaleString('en-US') : v.s; };

  function render() {
    for (const [a, el] of Object.entries(els)) {
      const v = value(a);
      el.textContent = shown(a);
      el.classList.toggle('num', 'n' in v);
      el.classList.toggle('err', 'err' in v);
      el.classList.toggle('sel', a === addr(sel.r, sel.c));
    }
    colHeads.forEach((h, c) => h.classList.toggle('on', c === sel.c));
    rowHeads.forEach((h, r) => h.classList.toggle('on', r === sel.r));
    $('nameBox').textContent = addr(sel.r, sel.c);
    $('formulaText').textContent = editing ? editor.value : (raw[addr(sel.r, sel.c)] ?? '');
  }
  function touched() {
    status.className = 'status saving'; statusText.textContent = 'Saving…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { saved = state(); status.className = 'status saved'; statusText.textContent = 'Saved'; }, 1100);
  }
  const state = () => ({ cells: { ...raw }, shown: Object.fromEntries(Object.keys(els).filter((a) => raw[a] !== undefined).map((a) => [a, shown(a)])) });

  // ---- selecting, editing, moving ---------------------------------------------------------------------------
  function startEdit(text) {
    const el = els[addr(sel.r, sel.c)];
    editing = true;
    Object.assign(editor.style, { left: el.offsetLeft + 'px', top: el.offsetTop + 'px', width: el.offsetWidth + 'px', height: el.offsetHeight + 'px' });
    editor.hidden = false; editor.value = text; editor.focus(); editor.setSelectionRange(text.length, text.length);
    render();
  }
  function stopEdit(keep) {
    if (!editing) return;
    const a = addr(sel.r, sel.c);
    if (keep) { if (editor.value === '') delete raw[a]; else raw[a] = editor.value; touched(); }
    editing = false; editor.hidden = true; editor.blur();
  }
  function move(dir) {
    if (dir === 'right') { if (tabCol === null) tabCol = sel.c; sel.c = Math.min(COLS - 1, sel.c + 1); }
    else if (dir === 'left') { sel.c = Math.max(0, sel.c - 1); tabCol = null; }
    else if (dir === 'down') { sel.c = tabCol ?? sel.c; tabCol = null; sel.r = Math.min(ROWS - 1, sel.r + 1); }
    else if (dir === 'up') { sel.r = Math.max(0, sel.r - 1); tabCol = null; }
  }
  editor.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); stopEdit(true); move('down'); render(); }
    else if (e.key === 'Tab') { e.preventDefault(); stopEdit(true); move(e.shiftKey ? 'left' : 'right'); render(); }
    else if (e.key === 'Escape') { e.preventDefault(); stopEdit(false); render(); }
  });
  editor.addEventListener('input', render);
  document.addEventListener('keydown', (e) => {
    if (editing || e.target === editor || e.ctrlKey || e.metaKey || e.altKey) return; // the editor's own keys end there
    const a = addr(sel.r, sel.c);
    if (e.key.length === 1) { e.preventDefault(); startEdit(e.key); }
    else if (e.key === 'Enter') { e.preventDefault(); startEdit(raw[a] ?? ''); }
    else if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); delete raw[a]; touched(); render(); }
    else if (e.key === 'Tab') { e.preventDefault(); move(e.shiftKey ? 'left' : 'right'); render(); }
    else if (/^Arrow(Up|Down|Left|Right)$/.test(e.key)) { e.preventDefault(); move(e.key.slice(5).toLowerCase()); render(); }
  });
  grid.addEventListener('mousedown', (e) => {
    const cell = e.target.closest('.c');
    if (!cell || e.target === editor) return;
    e.preventDefault();
    stopEdit(true); tabCol = null;
    const m = /^([A-F])(\d+)$/.exec(cell.dataset.cell);
    sel = { r: +m[2] - 1, c: m[1].charCodeAt(0) - 65 };
    render();
  });
  grid.addEventListener('dblclick', (e) => { if (e.target.closest('.c')) startEdit(raw[addr(sel.r, sel.c)] ?? ''); });
  render();

  // Read-only handles for the recording harness; nothing here changes page behaviour.
  window.__demo = { state, saved: () => saved, isSaved: () => status.classList.contains('saved'), cellEl: () => els[addr(sel.r, sel.c)] };
})();
</script>
</body>
</html>
