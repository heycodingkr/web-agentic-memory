<title>WAM demo stage</title>
<!--
  The edit: recorded Arise footage plus the story told around it (task, memory hints, captions, result).
  Everything is a pure function of time t, so the renderer can step through frames deterministically:
  window.__init(scene) once, then await window.__render(t) for every frame. No CSS transitions or animations.
-->
<style>

  /* flow layout */

  #task { left: 72px; top: 182px; width: 600px; min-height: 120px; padding: 24px 30px; border-radius: 26px 26px 26px 6px; background: #f5f3ec; color: #132f28; font: 800 35px/1.28 Manrope, sans-serif; letter-spacing: -.02em; }

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const prog = (t, a, d) => clamp((t - a) / d);
const lerp = (a, b, k) => a + (b - a) * k;
const show = (el, k, dy = 14) => { el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * dy}px)`; el.style.visibility = k > 0.001 ? 'visible' : 'hidden'; };

// Objects merge, arrays and strings replace: the Korean table only restates words, never timing or zoom.
const merge = (base, over) => {
  if (over === undefined) return base;
  if (Array.isArray(over) || typeof over !== 'object' || over === null) return over;
  const out = { ...base };
  for (const k of Object.keys(over)) out[k] = merge(base[k], over[k]);
  return out;
};

      ['popup', 'good', '✓ 힌트 1: 팝업부터 닫기'],
      ['title', 'neutral', '제목과 문단 작성'],
      ['p1_done', 'good', '✓ 힌트 2: 문단마다 Enter 한 번'],
      ['preview', 'good', '✓ 힌트 3: 미리보기 확인'],
      ['saved', 'good', '✓ 저장 — 한 번에 성공']
    ] },
    foot: ['파일럿 · 실제 블로그 에디터', '<b>85.5초 → 44.3초</b> &nbsp;·&nbsp; 도구 호출 <b>10 → 7</b>']
  }
};
const COPY_KO = merge(COPY_EN, KO_OVERRIDES);
const COPY_SETS = { en: COPY_EN, ko: COPY_KO };

/* ---------- time maps ---------- */
function buildMap(vStart, vEnd, speeds, cues) {
  const cuts = [vStart, vEnd];
  for (const [a, b] of speeds) { cuts.push(cues[a], cues[b]); }
  const pts = [...new Set(cuts.filter((x) => x >= vStart && x <= vEnd))].sort((x, y) => x - y);
  const segs = []; let o = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const s0 = pts[i], s1 = pts[i + 1];
    let k = 1;
    for (const [a, b, f] of speeds) if (s0 >= cues[a] - 1e-6 && s1 <= cues[b] + 1e-6) k = f;
    segs.push({ s0, s1, o0: o, o1: o + (s1 - s0) / k, k });
    o += (s1 - s0) / k;
  }
  return {
    total: o,
    toSrc: (t) => { for (const g of segs) if (t <= g.o1 + 1e-9) return g.s0 + (t - g.o0) * g.k; return segs[segs.length - 1].s1; },
    toOut: (s) => { for (const g of segs) if (s <= g.s1 + 1e-9) return g.o0 + (Math.max(s, g.s0) - g.s0) / g.k; return o; },
    speedAt: (t) => { for (const g of segs) if (t <= g.o1 + 1e-9) return g.k; return 1; }
  };
}

/* ---------- state ---------- */
let S = null; // {copy, name, footage:{key:{fps,frames,dir,cues,marker}}, ...}
const frameUrl = (f, tSrc) => {
  const n = clamp(Math.round(tSrc * f.fps) + 1, 1, f.frames);
  return `file://${f.dir}/${String(n).padStart(5, '0')}.jpg`;
};
const loaded = new WeakMap();
async function setFrame(img, url) {
  if (loaded.get(img) === url) return;
  img.src = url; loaded.set(img, url);
  try { await img.decode(); } catch (e) { /* decode can reject on a stale src; the next frame retries */ }
}

window.__init = async (scene) => {
  S = scene;
  const dir = scene.fontsDir;
  const faces = [['Manrope', 'Manrope[wght].ttf', '200 800'], ['DM Sans', 'DMSans[opsz,wght].ttf', '100 1000'], ['DM Mono', 'DMMono-Medium.ttf', '500']];
  const style = document.createElement('style');
  style.textContent = faces.map(([n, f, w]) => `@font-face{font-family:"${n}";src:url("file://${dir}/${f}");font-weight:${w}}`).join('\n');
  document.head.appendChild(style);
  await Promise.all(['800 40px Manrope', '700 30px Manrope', '600 24px Manrope', '400 20px "DM Sans"', '500 14px "DM Mono"'].map((f) => document.fonts.load(f, 'Ag0')));
  await document.fonts.ready;

  const lang = scene.lang === 'ko' ? 'ko' : 'en';
  const ui = UI[lang];
  S.ui = ui;
  document.body.classList.toggle('ko', lang === 'ko');
  document.documentElement.lang = lang;
  const c = COPY_SETS[lang][scene.name];
  S.copy = c;
  $('taskLabel').textContent = ui.youAsk;
  $('memTitle').textContent = ui.memory;
  $('memEx').textContent = ui.example;
  $('cmpTitle').innerHTML = ui.cmpTitle;
  $('labelA').textContent = ui.without;
  $('labelB').textContent = ui.withHints;
  $('speedA').textContent = ui.sped;
  $('speedB').textContent = ui.sped;
  $('doneA').textContent = ui.saved;
  $('doneB').textContent = ui.saved;
  $('flow').style.display = c.kind === 'flow' ? 'block' : 'none';
  $('compare').style.display = c.kind === 'compare' ? 'block' : 'none';
  if (c.kind === 'flow') {
    const f = scene.footage[c.footage];
    S.f = f;
    S.vStart = f.marker[1] + 0.25;
    S.vEnd = f.cues.end + 0.35;
    S.map = buildMap(S.vStart, S.vEnd, c.speed, f.cues);
    S.endHold = 4.2;
    S.duration = S.map.total + S.endHold;
    $('tagText').textContent = c.tag;
    $('memMeta').textContent = ui.site + ' ' + c.meta.split(' · ')[0] + ' · ' + ui.task + ' ' + c.meta.split(' · ')[1];
    $('hints').innerHTML = c.hints.map((h, i) => `<li class="hint"><span class="n">${i + 1}</span><p>${h}</p></li>`).join('');
    S.hintEls = [...document.querySelectorAll('.hint')];
    $('result').textContent = c.result;
    $('endKicker').textContent = c.end.kicker;
    $('endHead').innerHTML = c.end.head;
    $('endBody').innerHTML = c.end.stats
      ? c.end.stats.map(([b, s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join('')
      : `<ul id="endList">${c.end.list.map((x) => `<li><i>✓</i>${x}</li>`).join('')}</ul>`;
    $('endFoot').textContent = c.end.foot;
    S.o = {}; // cue -> out time
    for (const [k, v] of Object.entries(f.cues)) S.o[k] = S.map.toOut(Math.max(v, S.vStart));
  } else {
    S.L = scene.footage[c.left.footage]; S.R = scene.footage[c.right.footage];
    const mk = (cfg, f) => {
      const vStart = f.cues[cfg.start] - 0.35;
      const vEnd = f.cues.end + 0.2;
      const map = buildMap(vStart, vEnd, cfg.speed, f.cues);
      return { vStart, vEnd, map, dur: map.total, f, cfg };
    };
    S.A = mk(c.left, S.L); S.B = mk(c.right, S.R);
    S.holdEnd = 4.4;
    S.duration = Math.max(S.A.dur, S.B.dur) + S.holdEnd;
    $('cmpSub').textContent = c.sub;
    $('cmpFootInner').innerHTML = `<span>${c.foot[1]}</span><small>${c.foot[0]}${c.noSingle ? '' : ' · ' + ui.single}</small>`;
  }
  return S.duration;
};

function zoomAt(frames, O, t) {
  let from = { s: 1, cx: 0.5, cy: 0.5 };
  const D = 0.9;
  for (const [cue, s, cx, cy, off = 0] of frames) {
    const at = O[cue] + off;
    if (t < at) break;
    const k = ease(prog(t, at, D));
    const cur = { s: lerp(from.s, s, k), cx: lerp(from.cx, cx, k), cy: lerp(from.cy, cy, k) };
    if (t >= at + D) from = { s, cx, cy }; else return cur;
  }
  return from;
}

const typed = (text, t, a, cps) => text.slice(0, Math.max(0, Math.floor((t - a) * cps)));

function renderFlow(t) {
  const c = S.copy, O = S.o, f = S.f;
  const inEnd = t > S.map.total + 0.15;
  const tSrc = S.map.toSrc(Math.min(t, S.map.total));
  const endK = ease(prog(t, S.map.total + 0.05, 0.3)); // old elements leave first
  const endIn = ease(prog(t, S.map.total + 0.35, 0.55)); // then the end card arrives

  // footage, with a slow zoom toward whatever the agent is doing
  const winK = 1;
  return setFrame($('frame'), frameUrl(f, tSrc)).then(() => {
    const z = zoomAt(c.zoom || [], O, t);
    const W = 1116, H = 740;
    const tx = clamp(W / 2 - z.cx * W * z.s, W - W * z.s, 0), ty = clamp(H / 2 - z.cy * H * z.s, H - H * z.s, 0);
    $('frame').style.transform = `translate(${tx}px, ${ty}px) scale(${z.s})`;
    $('win').style.opacity = winK;
    show($('brand'), ease(prog(t, 0, 0.5)), 0); $('tag').style.opacity = ease(prog(t, 0.2, 0.5));

    // task bubble
    const tk = ease(prog(t, O.task - 0.1, 0.4));
    show($('taskLabel'), tk * (1 - endK), 8); show($('task'), tk * (1 - endK), 14);
    const full = c.task, cps = 34;
    const shown = typed(full, t, O.task + 0.15, cps);
    $('taskText').textContent = shown;
    $('caret').style.opacity = shown.length < full.length || Math.floor(t * 2) % 2 === 0 ? 1 : 0;

    // memory card
    const mk = ease(prog(t, O.recall - 0.05, 0.45));
    show($('mem'), mk * (1 - endK), 16);
    const answered = t >= O.hints;
    $('spin').style.display = answered ? 'none' : 'block';
    $('spin').style.transform = `rotate(${t * 420}deg)`;
    $('memChipText').textContent = answered ? S.ui.chip : S.ui.asking;
    show($('memMeta'), mk, 0);
    S.hintEls.forEach((el, i) => {
      const k = ease(prog(t, O.hints + 0.18 + i * 0.28, 0.4));
      const a = ease(prog(t, O[c.applies[i]], 0.35));
      el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * 14}px)`; el.style.visibility = k > 0.001 ? 'visible' : 'hidden';
      el.style.background = `rgba(216,239,120,${lerp(0.035, 0.17, a)})`;
      el.style.borderColor = `rgba(216,239,120,${lerp(0.1, 0.7, a)})`;
      const n = el.firstElementChild; n.style.background = `rgba(216,239,120,${a})`; n.style.color = a > 0.5 ? '#132f28' : '#d8ef78'; n.textContent = a > 0.5 ? '✓' : String(i + 1);
    });

    // result pill
    show($('result'), ease(prog(t, O.saved + 0.1, 0.4)) * (1 - endK), 10);

    // caption
    let idx = -1;
    c.captions.forEach(([cue], i) => { if (t >= O[cue]) idx = i; });
    const capStart = idx >= 0 ? O[c.captions[idx][0]] : 0;
    if (idx >= 0) { $('capText').innerHTML = c.captions[idx][1]; $('capStep').textContent = S.ui.step(Math.min(idx + 1, c.captions.length), c.captions.length); }
    show($('cap'), idx >= 0 ? ease(prog(t, capStart, 0.3)) * (1 - endK) : 0, 8);

    // end card replaces the left column
    show($('end'), endIn, 18);
    return true;
  });
}

function pane(side, t) {
  const m = side === 'A' ? S.A : S.B;
  const tSrc = m.map.toSrc(Math.min(t, m.dur));
  const finished = t >= m.dur - 0.01;
  const cfg = m.cfg;
  let st = null;
  for (const row of cfg.statuses) if (tSrc >= m.f.cues[row[0]] - 0.05) st = row;
  const el = $('status' + side);
  if (st) { el.className = 'abs paneStatus ' + st[1]; el.textContent = st[2]; el.style.opacity = ease(prog(tSrc, m.f.cues[st[0]] - 0.05, 0.5)); }
  else el.style.opacity = 0;
  const doneAt = m.f.cues[cfg.done];
  const dk = ease(prog(tSrc, doneAt, 0.5));
  show($('done' + side), dk, -10);
  $('speed' + side).style.opacity = !finished && m.map.speedAt(t) > 1.2 ? 1 : 0;
  return setFrame($('frame' + side), frameUrl(m.f, tSrc));
}

async function renderCompare(t) {
  await Promise.all([pane('A', t), pane('B', t)]);
  show($('brand'), ease(prog(t, 0, 0.5)), 0);
  const lastDone = Math.max(S.A.dur, S.B.dur);
  show($('cmpFoot'), ease(prog(t, lastDone + 0.3, 0.6)), 12);
  show($('cmpTitle'), ease(prog(t, 0, 0.5)), 10);
}

window.__render = async (t) => {
  const tt = clamp(t, 0, S.duration);
  if (S.copy.kind === 'flow') await renderFlow(tt); else await renderCompare(tt);
  const fade = Math.max(1 - prog(tt, 0, 0.35), prog(tt, S.duration - 0.45, 0.45));
  $('fade').style.opacity = clamp(fade);
  return true;
};
</script>
