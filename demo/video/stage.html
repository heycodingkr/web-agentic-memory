<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Web Agentic Memory — demo day video stage (v2)</title>
<!--
  A pure function of time: window.__render(t) draws second t of the video. build.mjs loads this page in Chrome,
  calls __render for every frame, takes a screenshot and pipes it to ffmpeg. Nothing here depends on machine speed.
  v2 story: people work at URLs, a URL is the best index for work memory, a real agent run, measured effect,
  sharing over CLI/MCP, the leaderboard, and the ripple effect.
  Every number comes from this repository (docs/test/benchmarks/*, docs/design/meta-model-usage.ko.md) or from a
  captured run (captures/): see demo/video/README.md. Real footage is composited by build.mjs after the render
  (window.__overlays); this stage only draws the dark "hole" where each clip goes.
-->
<style>
@font-face { font-family: Manrope; src: url('/web/static/fonts/manrope-latin.woff2') format('woff2'); font-weight: 200 800; }
@font-face { font-family: 'DM Sans'; src: url('/web/static/fonts/dm-sans-latin.woff2') format('woff2'); font-weight: 100 1000; }
@font-face { font-family: 'DM Mono'; src: url('/web/static/fonts/dm-mono-latin-400.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'DM Mono'; src: url('/web/static/fonts/dm-mono-latin-500.woff2') format('woff2'); font-weight: 500; }
:root { --paper: #f5f3ec; --card: #fffef9; --ink: #13261f; --deep: #112c23; --green: #254b3c; --lime: #d8ef78; --line: #d7e0d1; --muted: #566a5f; --coral: #e0714f; --soft: #e8f0da; --term: #0e1f19; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); font-family: 'DM Sans', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
.scene { position: absolute; inset: 0; opacity: 0; display: none; }
.scene.dark { background: var(--deep); color: #f3f1e8; }
.abs { position: absolute; }
.h { font-family: Manrope, sans-serif; font-weight: 800; letter-spacing: -.04em; line-height: 1.04; }
.mono { font-family: 'DM Mono', monospace; }
.muted { color: var(--muted); }
.chip { display: inline-block; padding: 6px 16px; border-radius: 999px; font-weight: 700; font-size: 24px; background: var(--soft); color: var(--green); border: 2px solid #c9d8b8; }
.chip.dark { background: var(--deep); color: var(--lime); border-color: var(--deep); }
.chip.coral { background: #fbe4dc; color: #a8442a; border-color: #f0bfae; }
.card { position: absolute; background: var(--card); border: 2px solid var(--line); border-radius: 28px; box-shadow: 0 24px 60px rgba(19, 47, 40, .10); }
.hole { position: absolute; background: #0b1814; border: 2px solid #1f3a30; border-radius: 14px; box-shadow: 0 24px 60px rgba(19, 47, 40, .20); }
.logo { position: absolute; left: 72px; top: 40px; height: 46px; }
#badge { position: absolute; right: 72px; top: 44px; padding: 8px 20px; border-radius: 999px; font: 700 22px 'DM Mono', monospace; letter-spacing: .04em; background: var(--lime); color: var(--deep); opacity: 0; }
#badge.before { background: #fbe4dc; color: #8a3a22; }
#cap { position: absolute; left: 150px; right: 150px; bottom: 56px; padding: 20px 40px; border-radius: 18px; background: rgba(17, 44, 35, .94); color: #fff; font: 600 40px/1.28 'DM Sans', sans-serif; text-align: center; opacity: 0; }
#cap.ondark { background: rgba(255, 255, 255, .12); }
.term { position: absolute; background: var(--term); border-radius: 22px; overflow: hidden; box-shadow: 0 30px 70px rgba(10, 30, 22, .35); border: 2px solid #1f3a30; }

.term .dot { width: 14px; height: 14px; border-radius: 50%; background: #3a5a4d; }
.term .body { position: absolute; left: 0; right: 0; top: 58px; bottom: 0; overflow: hidden; padding: 18px 26px; }
.term .lines { position: absolute; left: 26px; right: 26px; top: 18px; }
.ln { white-space: pre; font: 400 18px/1.6 'DM Mono', monospace; color: #cfe0d5; opacity: 0; height: 29px; overflow: hidden; }
.ln.head { color: #8fb3a0; font-weight: 500; }
.ln.row { color: #fff; font-weight: 500; background: rgba(216, 239, 120, .10); border-radius: 6px; margin-top: 8px; }
.ln.call { color: #d8ef78; }
.ln.res { color: #7f9a8d; }
.ln.cost { color: #d8ef78; font-weight: 500; margin-top: 8px; }
.ln.ok { color: #d8ef78; font-weight: 500; }
.ln.cmd { color: #fff; }
.ln.cmd::before { content: '$ '; color: #d8ef78; }
.bar-track { position: absolute; height: 22px; border-radius: 11px; background: #e6ece0; overflow: hidden; }
.bar-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 11px; }
.num { font-family: Manrope, sans-serif; font-weight: 800; letter-spacing: -.045em; }
</style>

<body>
<div id="stage">
  <img class="logo" id="logo" src="/web/static/brand/wam-logo.svg" alt="">
  <div id="badge">NEW · built Oct 27–Nov 4</div>
  <div id="scenes"></div>
  <div id="cap"></div>
</div>
<script>
'use strict';
// ───────────────────────── helpers ─────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const seg = (t, a, b) => clamp((t - a) / (b - a));
const fade = (t, a, b) => ease(seg(t, a, b));
const lerp = (a, b, p) => a + (b - a) * p;
const el = (tag, cls, html, parent, css) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (css) e.style.cssText = css; if (parent) parent.appendChild(e); return e; };
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const show = (e, a, dy = 0, dx = 0, scale = 1) => { e.style.opacity = a; e.style.transform = `translate(${(1 - a) * dx}px, ${(1 - a) * dy}px) scale(${lerp(.97, 1, a) * scale})`; };
const fmt1 = (n) => n.toFixed(1);
const clip = (s, n) => (s.length > n ? s.slice(0, n - 1) + '…' : s);
const typed = (s, p) => s.slice(0, Math.floor(clamp(p) * s.length));
const clock = (sec) => `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, '0')}`;
const minsec = (sec) => `${Math.floor(Math.round(sec) / 60)} min ${String(Math.round(sec) % 60).padStart(2, '0')} s`;
const wrap = (s, n) => { const out = []; let line = ''; s.split(' ').forEach((w) => { if ((line + ' ' + w).trim().length > n) { out.push(line); line = w; } else line = (line + ' ' + w).trim(); }); if (line) out.push(line); return out; };

// ───────────────────────── numbers (all from repo docs or captured runs) ─────────────────────────
const D = {
  calendar: { t: 431.108, m: 237.169, tc: 114, mc: 68 },           // docs/test/benchmarks/google-calendar.md, R8
  canva: { t: 473.976, m: 423.193, tc: 123, mc: 106 },             // docs/test/benchmarks/canva.md, R7
  slides: null                                                      // captures/run-slides.json: real Arise + gpt-6-luna/max runs, 2026-11-02
};
// Earlier 2026-10-16 pilot, Codex gpt-6-luna / max, one run per condition. English rows only (Naver is shown in Korean only):
// web/src/lib/landing.ts pilotRows, docs/test/benchmarks.md. Same formula as the landing page: the mean of each row's relative change.
const PILOT = [
  { id: 'medium', t: 85.5, m: 44.3, tc: 10, mc: 7 },
  { id: 'rich', t: 130.3, m: 55.2, tc: 16, mc: 11 },
  { id: 'iframe', t: 195.4, m: 130.9, tc: 28, mc: 17 }
];
const chg = (a, b) => (b - a) / a;
const mean = (v) => v.reduce((x, y) => x + y, 0) / v.length;
const pc = (f) => `${f < 0 ? '−' : '+'}${Math.abs(Math.round(f * 100))}%`;
const pTime = PILOT.map((r) => chg(r.t, r.m)), pCalls = PILOT.map((r) => chg(r.tc, r.mc));
const PILOT_TIME = Math.abs(Math.round(mean(pTime) * 100)), PILOT_CALLS = Math.abs(Math.round(mean(pCalls) * 100));   // 46 and 34, as on the landing page
if (PILOT_TIME !== 46 || PILOT_CALLS !== 34) throw new Error(`pilot average drifted from the landing page: ${PILOT_TIME}/${PILOT_CALLS}`);
const PILOT_TIME_RANGE = `${pc(Math.max(...pTime))} to ${pc(Math.min(...pTime))}`, PILOT_CALLS_RANGE = `${pc(Math.max(...pCalls))} to ${pc(Math.min(...pCalls))}`;

// ───────────────────────── scene timeline (seconds) ─────────────────────────
const TIMES = { s1: [0, 22], s2: [22, 45], s3: [45, 96], s4: [96, 112], s5: [112, 132], s6: [132, 148], s7: [148, 160], s8: [160, 170] };
const TOTAL = 170;

// Burned-in English captions. There is no voice track, so these carry the story. [start, end, text, onDark]
const CAPTIONS = [
  [0.4, 5.6, 'Mail in Gmail. Posts on Instagram. Proposals in Google Slides.'],
  [5.9, 11.2, 'Each URL has a short list of tasks, the same for everyone.'],
  [11.8, 17.2, 'Agents relearn them in every session…'],
  [17.4, 21.6, '…then throw that work memory away.'],
  [22.5, 28.6, 'A URL is the best index for work memory.'],
  [29.0, 35.6, 'Real: the agent calls WAM over MCP with the page URL.'],
  [36.0, 44.6, 'Web Agentic Memory: share work memory, URL by URL.'],
  [45.5, 51.0, 'Arise browser, Luna at max effort. One prompt, no memory.'],
  [51.4, 57.0, 'A real run, sped up 12×. The clock and the step count are real.'],
  [57.4, 68.0, 'It relearns the editor: a photo covers the slide, fixed by hand.'],
  [68.4, 78.0, 'Slide 3: another photo, the same trial and error.'],
  [78.4, 86.0, 'Final checks, then Slides shows it saved.'],
  [86.6, 91.6, 'Saved: 3 slides, 2 photos. 8 min 21 s, 96 tool calls.'],
  [92.0, 95.6, 'A second session started from zero again.'],
  [96.4, 102.4, 'Earlier editor pilot: −46% time, −34% steps on average.'],
  [102.8, 107.2, 'Live sites: Calendar −45% time, −40% steps.'],
  [107.6, 111.6, 'Canva −11%, −14%. One run per condition.'],
  [112.4, 118.4, 'Share by CLI or MCP: a URL, a task and actions. No page text.'],
  [118.8, 125.0, "Meta's Muse Spark 1.3 decides what is worth remembering."],
  [125.4, 131.6, 'Labeled corpus 58/60. Prompt injections 12/12.'],
  [132.4, 139.6, 'A leaderboard counts what other agents get from your memory.'],
  [140.0, 147.6, '+20 published. +2 when another user succeeds. Anonymous: 0.'],
  [148.4, 154.0, "Build one site's work memory once. 1,000 people reuse it."],
  [154.4, 159.6, '≈14–54 hours saved. Illustrative: one measured run × 1,000.'],
  [160.4, 165.6, 'Built Oct 27 – Nov 4. Earlier work is listed separately.', true],
  [165.9, 169.6, "Don't throw your agent's work memory away. Share it.", true]
];

// Real clips composited by build.mjs after the render: files live in demo/out/. Times are video seconds.
window.__overlays = [];

// ───────────────────────── scenes ─────────────────────────
const scenes = [];
const root = () => document.getElementById('scenes');
const addScene = (id, cfg) => { const e = el('div', 'scene' + (cfg.dark ? ' dark' : ''), '', root()); e.id = id; scenes.push({ id, e, start: TIMES[id][0], end: TIMES[id][1], ...cfg }); return e; };
function title(parent, text, css) { return el('div', 'h abs', text, parent, css); }

// ── terminal builder ───────────────────────────────────
function makeTerm(parent, css, titleText) {
  const t = el('div', 'term', '', parent, css);
  const bar = el('div', 'bar', '<span class="dot"></span><span class="dot"></span><span class="dot"></span>', t);
  el('span', '', esc(titleText), bar, 'margin-left:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;');
  const body = el('div', 'body', '', t);
  const lines = el('div', 'lines', '', body);
  return { t, body, lines };
}
function placeLines(term, items, lineH = 29) {
  const els = items.map((it) => { const e = el('div', 'ln ' + (it.cls || ''), esc(it.text), term.lines); e.dataset.at = it.at; return e; });
  return (t, bodyH) => {
    let lastY = 0;
    els.forEach((e, i) => { const a = fade(t, items[i].at, items[i].at + 0.25); e.style.opacity = a; if (a > 0) lastY = i; });
    let h = 0;
    for (let i = 0; i <= lastY; i++) { if (els[i].style.opacity > 0) h += lineH + (items[i].cls && /row|cost/.test(items[i].cls) ? 8 : 0); }
    term.lines.style.transform = `translateY(${-Math.max(0, h - (bodyH - 56))}px)`;
  };
}

// ── S1 · people work at URLs; every session relearns and forgets ─────────
function buildS1() {
  const s = addScene('s1', { badge: 'none' });
  const t = title(s, 'People work at URLs.', 'left:100px;top:118px;font-size:96px;');
  const defs = [
    ['mail.google.com', 'Write an email', ['Compose', 'Add recipients', 'Subject and body', 'Send']],
    ['instagram.com', 'Post content', ['Create', 'Pick the media', 'Write a caption', 'Share']],
    ['docs.google.com/presentation', 'Build a proposal', ['New deck', 'Slides and text', 'Add photos', 'Saved']]
  ];
  const cards = defs.map((d, i) => {
    const c = el('div', 'card', '', s, `left:${100 + i * 610}px;top:320px;width:560px;height:380px;`);
    el('div', 'chip dark mono', d[0], c, 'position:absolute;left:30px;top:30px;font-size:25px;padding:6px 18px;');
    el('div', 'h', d[1], c, 'position:absolute;left:30px;top:98px;font-size:54px;');
    d[2].forEach((st, k) => el('div', '', `<span style="color:#4f7a3a;font-weight:800;margin-right:14px">${k + 1}</span>${st}`, c, `position:absolute;left:34px;top:${192 + k * 41}px;font-size:28px;font-weight:600;`));
    return c;
  });
  const line = el('div', 'h', 'A short list of tasks per URL.<br><span style="color:var(--green)">The same list for everyone.</span>', s, 'position:absolute;left:100px;top:740px;font-size:56px;line-height:1.1;');
  const note = el('div', 'muted', 'Illustration · task lists simplified', s, 'position:absolute;left:104px;top:880px;font-size:22px;');
  const B = el('div', 'abs', '', s, 'left:100px;top:118px;width:1720px;opacity:0;');
  el('div', 'h', 'And every agent relearns them.', B, 'font-size:92px;');
  const rows = ['Monday · an agent works out the Slides editor', 'Tuesday · another agent, the same detours', 'Wednesday · and again'].map((txt, i) => {
    const r = el('div', 'card', `<span style="color:#c9553a;font-weight:800;margin-right:18px;font-size:36px">✕</span>${txt}`, s, `left:100px;top:${330 + i * 132}px;width:1720px;height:104px;line-height:104px;padding:0 40px;font-size:36px;font-weight:600;`);
    el('div', 'chip coral', 'forgotten', r, 'position:absolute;right:36px;top:30px;line-height:1.2;font-size:28px;');
    return r;
  });
  const last = el('div', 'h', 'That work memory is thrown away.', s, 'position:absolute;left:100px;top:760px;font-size:68px;color:#a8442a;');
  s.update = (lt) => {
    const gone = 1 - fade(lt, 10.8, 11.5);
    show(t, fade(lt, 0.0, 0.8) * gone, 18);
    cards.forEach((c, i) => show(c, fade(lt, 1.0 + i * 1.4, 1.7 + i * 1.4) * gone, 26));
    show(line, fade(lt, 6.0, 6.8) * gone, 16);
    note.style.opacity = fade(lt, 1.2, 2.0) * gone;
    show(B, fade(lt, 11.8, 12.6), 18);
    rows.forEach((r, i) => show(r, fade(lt, 13.0 + i * 1.5, 13.7 + i * 1.5), 16));
    show(last, fade(lt, 18.0, 18.8), 14);
  };
}

// ── S2 · a URL is the index (real recall output, real MCP clip) ───────────
let recallParsed = null;
function parseRecall(text) {
  const lines = text.split('\n').filter((l) => l.trim().length);
  const out = []; let i = 1;                                       // line 0 is the command echo
  const m = lines[1] && lines[1].match(/^(web:[^ ]+) @ (ver-[0-9a-f]{12})[0-9a-f]* \| ([^|]+)\| score \d+ \| (.+)$/);
  if (m) { out.push({ cls: 'head', text: `${m[1]} @ ${m[2]}…` }, { cls: 'head', text: m[3].trim() }, { cls: 'row', text: m[4] }); i = 2; }
  for (; i < lines.length; i++) { if (/^Cache:/.test(lines[i])) continue; wrap(lines[i], 84).forEach((w, k) => out.push({ cls: /^pitfalls:/.test(lines[i]) ? 'call' : '', text: (k ? '  ' : '') + w })); }
  return out;
}
function buildS2() {
  const s = addScene('s2', { badge: 'new' });
  const t = title(s, 'A URL is the best index for work memory.', 'left:100px;top:98px;font-size:62px;white-space:nowrap;');
  const bar = el('div', 'card', '', s, 'left:100px;top:210px;width:1000px;height:84px;border-radius:42px;');
  const urlTxt = el('div', 'mono', '', bar, 'position:absolute;left:40px;top:0;height:80px;line-height:80px;font-size:28px;white-space:nowrap;');
  const why = el('div', 'muted', 'The agent already knows the URL before it acts. WAM matches the public URL pattern and a task code. No page text is sent.', s, 'position:absolute;left:104px;top:308px;width:990px;font-size:24px;line-height:1.4;');
  const term = makeTerm(s, 'left:100px;top:400px;width:1000px;height:512px;', 'wam recall · api.webagenticmemory.com · anonymous · unedited output, ids shortened');
  const items = [{ cls: 'cmd', text: 'wam recall https://docs.google.com/presentation/d/…/edit', at: 3.6 }, { cls: '', text: '    --task compose-draft --keyword deck --keyword create', at: 3.7 }];
  recallParsed.forEach((l, i) => items.push({ cls: l.cls, text: l.text, at: 5.2 + i * 0.5 }));
  const reveal = placeLines(term, items);
  const lab = el('div', 'mono', 'REAL · ARISE AGENT CALLS WAM OVER MCP', s, 'position:absolute;left:1200px;top:204px;font-size:19px;letter-spacing:.12em;color:#4f7a3a;');
  const hole = el('div', 'hole', '', s, 'left:1200px;top:240px;width:580px;height:645px;');
  const sub = el('div', 'muted', 'Arise chat at 2.5× speed · the call took 0.2 s', s, 'position:absolute;left:1200px;top:898px;width:640px;font-size:21px;');
  window.__overlays.push({ id: 'mcp-chat', file: 'slides-real/M-raw.mp4', src: { from: 12, to: 28 }, speed: 2.5, crop: { x: 0, y: 272, w: 490, h: 545 },
    x: 1202, y: 242, w: 576, h: 641, from: 29.2, to: 35.6 });
  const B = el('div', 'abs', '', s, 'left:100px;top:300px;width:1720px;opacity:0;');
  el('div', 'h', 'Share what works.<br><span style="color:var(--green)">URL by URL.</span>', B, 'font-size:128px;line-height:1.0;');
  el('div', 'chip dark', 'webagenticmemory.com', B, 'font-size:58px;margin-top:48px;padding:16px 46px;');
  el('div', '', ['Muse Code', 'Claude Code', 'Codex', 'Arise'].map((h) => `<span class="chip" style="margin-right:12px">${h}</span>`).join('') + '<span class="muted" style="margin-left:10px;font-size:26px;font-weight:600">read it over MCP or the CLI</span>', B, 'margin-top:40px;');
  s.update = (lt) => {
    const out = 1 - fade(lt, 13.6, 14.4);
    show(t, fade(lt, 0.0, 0.7) * out, 16); show(bar, fade(lt, 0.7, 1.3) * out, 16);
    urlTxt.textContent = typed('https://docs.google.com/presentation/d/…/edit', seg(lt, 1.0, 3.4)) + (lt < 3.6 ? '▌' : '');
    show(why, fade(lt, 3.0, 3.8) * out, 12);
    show(term.t, fade(lt, 3.3, 3.9) * out, 20); reveal(lt, 512 - 58);
    [lab, hole, sub].forEach((e) => { e.style.opacity = fade(lt, 6.4, 7.2) * out; });
    show(B, fade(lt, 14.6, 15.6), 20);
  };
}

// ── S3 · a real run: Arise browser + Luna max, no memory ──────────────────
function buildS3() {
  const s = addScene('s3', { badge: 'new' });
  const S = D.slides, run = S.runs.T, run2 = S.runs.T2, lap = S.lapse;
  const t0 = 1.0;                                                   // scene time when the lapse starts
  const r0 = lap.src_from - lap.run_offset_s;                       // run time shown when the lapse starts (the Slides start dialog is skipped)
  const lapseLen = (run.duration_s - r0) / lap.speed;
  const startT = TIMES.s3[0] + t0;
  title(s, 'One prompt. An English proposal, with photos.', 'left:80px;top:92px;font-size:56px;');
  el('div', 'muted', 'Arise browser 0.1.64 · gpt-6-luna (max effort) · no memory · a real run, sped up ×' + lap.speed, s, 'position:absolute;left:84px;top:166px;font-size:26px;');
  el('div', 'hole', '', s, 'left:80px;top:214px;width:1160px;height:562px;');
  window.__overlays.push({ id: 'T-lapse', file: lap.clip, src: { from: lap.src_from, to: lap.src_to }, speed: lap.speed,
    crop: { x: 0, y: 90, w: 1920, h: 926 }, mask: [{ x: 1832, y: 62, w: 76, h: 68, color: 'white' }],   // crop drops the tab strip, URL bar and the project-name row; mask hides the account avatar
    x: 82, y: 216, w: 1156, h: 558, from: startT, to: TIMES.s3[1] - 0.4, hold: true });   // hold: the last frame stays until the scene ends
  const c1 = el('div', 'card', '', s, 'left:1290px;top:214px;width:550px;height:140px;');
  el('div', 'mono', 'REAL TIME', c1, 'position:absolute;left:28px;top:18px;font-size:20px;letter-spacing:.14em;color:#4f7a3a;');
  const clk = el('div', 'num', '0:15', c1, 'position:absolute;left:28px;top:40px;font-size:88px;line-height:1;');

// ── S5 · share by CLI or MCP; the Gatekeeper decides ─────────────────────
let curate = null; let proposeHelp = '';
function parseCurate(text) {
  const out = []; let turns = 0, cost = null;
  text.split('\n').forEach((raw) => {
    if (!raw.trim()) return;
    if (raw.startsWith('scenario ')) out.push({ cls: 'head', text: raw });
    else if (raw.startsWith('    -> ')) out.push({ cls: 'call', text: raw.trim() });
    else if (raw.startsWith('    <- ')) out.push({ cls: 'res', text: raw.trim() });
    else if (raw.startsWith('model cost')) { out.push({ cls: 'cost', text: raw }); cost = raw.match(/\$([\d.]+)/)[1]; }
    else { out.push({ cls: 'row', text: raw }); const m = raw.match(/\s(\d+)\s+(PASS|FAIL)/); if (m) turns += +m[1]; }
  });
  return { lines: out, turns, cost };
}

// ───────────────────────── render ─────────────────────────
const logo = () => document.getElementById('logo');
const badgeEl = () => document.getElementById('badge');
const capEl = () => document.getElementById('cap');
window.__captions = CAPTIONS;
window.__total = TOTAL;
window.__poster = 40.5;
window.__render = (t) => {
  let active = null;
  scenes.forEach((sc) => {
    const inA = sc.start === 0 ? 1 : fade(t, sc.start, sc.start + 0.45);
    const outA = sc.end >= TOTAL ? 1 - fade(t, sc.end - 0.8, sc.end) : 1 - fade(t, sc.end - 0.45, sc.end);
    const a = Math.min(inA, outA);
    if (t >= sc.start && t < sc.end + 0.001 && a > 0.001) {
      sc.e.style.display = 'block'; sc.e.style.opacity = a;
      sc.e.update(t - sc.start, t);
      if (a >= (active ? active.a : 0)) active = { sc, a };
    } else sc.e.style.display = 'none';
  });
  const lg = logo(); const dark = active && active.sc.dark;
  lg.src = dark ? '/web/static/brand/wam-logo-reversed.svg' : '/web/static/brand/wam-logo.svg';
  lg.style.opacity = active ? active.a : 0;
  const b = badgeEl(); const kind = active ? active.sc.badge : 'none';
  b.style.opacity = kind === 'none' ? 0 : active.a; b.className = kind === 'before' ? 'before' : ''; b.textContent = kind === 'before' ? 'BEFORE · earlier work' : 'NEW · built Oct 27–Nov 4';
  const c = CAPTIONS.find((x) => t >= x[0] && t <= x[1]);
  const cap = capEl();
  if (c) { cap.textContent = c[2]; cap.className = c[3] ? 'ondark' : ''; cap.id = 'cap'; cap.style.opacity = Math.min(fade(t, c[0], c[0] + 0.18), 1 - fade(t, c[1] - 0.18, c[1])); }
  else cap.style.opacity = 0;
};
