<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Web Agentic Memory — demo day video stage</title>
<!--
  A pure function of time: window.__render(t) draws second t of the video. build.mjs loads this page in Chrome,
  calls __render for every frame, takes a screenshot and pipes it to ffmpeg. Nothing here depends on machine speed.
  Every number comes from this repository (docs/test/benchmarks/*, docs/design/meta-model-usage.ko.md) or from a
  captured run (captures/): see demo/video/README.md.
-->
<style>
@font-face { font-family: Manrope; src: url('/web/static/fonts/manrope-latin.woff2') format('woff2'); font-weight: 200 800; }
@font-face { font-family: 'DM Sans'; src: url('/web/static/fonts/dm-sans-latin.woff2') format('woff2'); font-weight: 100 1000; }
@font-face { font-family: 'DM Mono'; src: url('/web/static/fonts/dm-mono-latin-400.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'DM Mono'; src: url('/web/static/fonts/dm-mono-latin-500.woff2') format('woff2'); font-weight: 500; }
:root { --paper: #f5f3ec; --card: #fffef9; --ink: #13261f; --deep: #112c23; --green: #254b3c; --lime: #d8ef78; --line: #d7e0d1; --muted: #566a5f; --coral: #e0714f; --soft: #e8f0da; --term: #0e1f19; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); font-family: 'DM Sans', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
.scene { position: absolute; inset: 0; opacity: 0; display: none; }
.scene.dark { background: var(--deep); color: #f3f1e8; }
.abs { position: absolute; }
.h { font-family: Manrope, sans-serif; font-weight: 800; letter-spacing: -.04em; line-height: 1.04; }
.mono { font-family: 'DM Mono', monospace; }
.muted { color: var(--muted); }
.chip { display: inline-block; padding: 6px 16px; border-radius: 999px; font-weight: 700; font-size: 24px; background: var(--soft); color: var(--green); border: 2px solid #c9d8b8; }
.chip.dark { background: var(--deep); color: var(--lime); border-color: var(--deep); }
.chip.coral { background: #fbe4dc; color: #a8442a; border-color: #f0bfae; }
.card { position: absolute; background: var(--card); border: 2px solid var(--line); border-radius: 28px; box-shadow: 0 24px 60px rgba(19, 47, 40, .10); }
.logo { position: absolute; left: 72px; top: 40px; height: 46px; }
#badge { position: absolute; right: 72px; top: 44px; padding: 8px 20px; border-radius: 999px; font: 700 22px 'DM Mono', monospace; letter-spacing: .04em; background: var(--lime); color: var(--deep); opacity: 0; }
#badge.before { background: #fbe4dc; color: #8a3a22; }
#cap { position: absolute; left: 150px; right: 150px; bottom: 56px; padding: 20px 40px; border-radius: 18px; background: rgba(17, 44, 35, .94); color: #fff; font: 600 40px/1.28 'DM Sans', sans-serif; text-align: center; opacity: 0; }
#cap.ondark { background: rgba(255, 255, 255, .12); }
.term { position: absolute; background: var(--term); border-radius: 22px; overflow: hidden; box-shadow: 0 30px 70px rgba(10, 30, 22, .35); border: 2px solid #1f3a30; }
.term .bar { height: 58px; background: #16302a; display: flex; align-items: center; gap: 10px; padding: 0 22px; font: 500 20px 'DM Mono', monospace; color: #9db3a8; }
.term .dot { width: 14px; height: 14px; border-radius: 50%; background: #3a5a4d; }
.term .body { position: absolute; left: 0; right: 0; top: 58px; bottom: 0; overflow: hidden; padding: 18px 26px; }
.term .lines { position: absolute; left: 26px; right: 26px; top: 18px; }
.ln { white-space: pre; font: 400 18px/1.6 'DM Mono', monospace; color: #cfe0d5; opacity: 0; height: 29px; overflow: hidden; }
.ln.head { color: #8fb3a0; font-weight: 500; }
.ln.row { color: #fff; font-weight: 500; background: rgba(216, 239, 120, .10); border-radius: 6px; margin-top: 8px; }
.ln.call { color: #d8ef78; }
.ln.res { color: #7f9a8d; }
.ln.cost { color: #d8ef78; font-weight: 500; margin-top: 8px; }
.ln.ok { color: #d8ef78; font-weight: 500; }
.ln.cmd { color: #fff; }
.ln.cmd::before { content: '$ '; color: #d8ef78; }
.cursor { display: inline-block; width: 11px; height: 22px; background: #d8ef78; vertical-align: -4px; }
.bar-track { position: absolute; height: 22px; border-radius: 11px; background: #e6ece0; overflow: hidden; }
.bar-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 11px; }
.num { font-family: Manrope, sans-serif; font-weight: 800; letter-spacing: -.045em; }
</style>
</head>
<body>
<div id="stage">
  <img class="logo" id="logo" src="/web/static/brand/wam-logo.svg" alt="">
  <div id="badge">NEW · built Oct 27–Nov 4</div>
  <div id="scenes"></div>
  <div id="cap"></div>
</div>
<script>
'use strict';
// ───────────────────────── helpers ─────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const easeIO = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const seg = (t, a, b) => clamp((t - a) / (b - a));
const fade = (t, a, b) => ease(seg(t, a, b));
const lerp = (a, b, p) => a + (b - a) * p;
const el = (tag, cls, html, parent, css) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (css) e.style.cssText = css; if (parent) parent.appendChild(e); return e; };
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const show = (e, a, dy = 0, dx = 0, scale = 1) => { e.style.opacity = a; e.style.transform = `translate(${(1 - a) * dx}px, ${(1 - a) * dy}px) scale(${lerp(.97, 1, a) * scale})`; };
const fmt1 = (n) => n.toFixed(1);
const clip = (s, n) => (s.length > n ? s.slice(0, n - 1) + '…' : s);
const typed = (s, p) => s.slice(0, Math.floor(clamp(p) * s.length));

// ───────────────────────── numbers (all from repo docs) ─────────────────────────
const D = {
  calendar: { t: 431.108, m: 237.169, tc: 114, mc: 68 },           // docs/test/benchmarks/google-calendar.md, R8
  canva: { t: 473.976, m: 423.193, tc: 123, mc: 106 },             // docs/test/benchmarks/canva.md, R7
  notion: { t: 301.862, m1: 375.414, m2: 406.530, tc: 125, m1c: 112, m2c: 126 } // docs/test/benchmarks/notion.md, R8
};

// ───────────────────────── scene timeline (seconds) ─────────────────────────
const TIMES = { s1: [0, 10], s2: [10, 22], s3: [22, 50], s4: [50, 65], s5: [65, 110], s6: [110, 130], s7: [130, 155], s8: [155, 170] };
const TOTAL = 170;

// Burned-in English captions. There is no voice track, so these carry the story. [start, end, text, onDark]
const CAPTIONS = [
  [0.4, 5.2, 'Same Google Calendar task. Same agent. 431 seconds, 114 tool calls.'],
  [5.4, 9.6, 'With shared memory: 237 seconds, 68 calls.'],
  [10.4, 16.4, 'Browser agents relearn every website from zero.'],
  [16.8, 21.7, 'Web Agentic Memory: shared memory your agent reads over MCP.'],
  [22.5, 27.5, 'Canva: export one page as PNG and PDF.'],
  [27.9, 33.4, 'Google Calendar: recurring sessions across time zones.'],
  [33.8, 38.6, 'With hints, Calendar finished 45% faster and Canva 11% (single runs).'],
  [38.9, 43.8, 'Notion got slower, so we did not adopt those hints.'],
  [44.0, 47.0, 'We publish the misses too.'],
  [47.2, 49.7, 'Docs, Slides, Sheets, Gmail: scripted demos.'],
  [50.4, 57.0, 'Anyone can contribute, with consent, as a closed schema.'],
  [57.3, 64.4, 'Server-side checks screen it and replay it before any model sees it.'],
  [65.4, 71.8, "The Gatekeeper's LLM: Meta's Muse Spark 1.3 via the Meta Model API."],
  [72.0, 77.8, 'Every contribution: ten bounded tools to read, compare and decide.'],
  [78.0, 86.0, 'Duplicate: support it. Better: replace it. New: create it.'],
  [86.2, 94.5, 'Conflict or planted instructions: escalate to a human, never obey.'],
  [94.8, 101.5, 'Labeled corpus 58/60. Prompt injections 12/12.'],
  [101.8, 109.6, 'Live just now: 5 reviews, 20 Muse Spark turns, all PASS, $0.049.'],
  [110.4, 117.4, 'Any agent can read it. Here: Muse Spark in Muse Code, over MCP.'],
  [117.8, 124.4, 'The author earns points only when another signed-in user succeeds.'],
  [124.8, 129.5, 'Anonymous reads get the hint: no receipt, no points.'],
  [130.4, 137.4, 'About two cents per review. Duplicates and reads cost nothing.'],
  [137.8, 144.9, 'In these runs: Calendar −194 s, −46 calls; Canva −51 s, −17 calls.'],
  [145.3, 154.3, 'Pay once, reuse every run. A daily cap keeps spend bounded.'],
  [155.4, 161.5, 'Built Oct 27 – Nov 4. Earlier work is listed separately.', true],
  [161.8, 169.4, 'Muse decides. Every agent follows.', true]
];

// ───────────────────────── scenes ─────────────────────────
const scenes = [];
const root = () => document.getElementById('scenes');
const addScene = (id, cfg) => { const e = el('div', 'scene' + (cfg.dark ? ' dark' : ''), '', root()); e.id = id; scenes.push({ id, e, start: TIMES[id][0], end: TIMES[id][1], ...cfg }); return e; };

function title(parent, text, css) { return el('div', 'h abs', text, parent, css); }

// ── S1 · hook ───────────────────────────────────────────
function buildS1() {
  const s = addScene('s1', { badge: 'new' });
  const t = title(s, 'Same Google Calendar task.<br>Same agent.', 'left:0;right:0;top:120px;text-align:center;font-size:76px;');
  const make = (x, label, color, kind) => {
    const c = el('div', 'card', '', s, `left:${x}px;top:330px;width:780px;height:430px;`);
    el('div', 'h', label, c, 'position:absolute;left:44px;top:34px;font-size:38px;');
    const timer = el('div', 'num', '0.0', c, 'position:absolute;left:44px;top:100px;font-size:150px;line-height:1;');
    el('div', 'muted', 'seconds', c, 'position:absolute;left:46px;top:262px;font-size:28px;');
    const track = el('div', 'bar-track', '', c, 'left:44px;top:312px;width:692px;');
    const fill = el('div', 'bar-fill', '', track, `background:${color};width:0;`);
    el('div', 'muted', 'tool calls', c, 'position:absolute;left:46px;top:358px;font-size:28px;');
    const calls = el('div', 'num', '0', c, 'position:absolute;left:230px;top:338px;font-size:64px;line-height:1;');
    const done = el('div', 'chip dark', '✓ finished', c, 'position:absolute;right:44px;top:44px;opacity:0;');
    return { c, timer, fill, calls, done };
  };
  const L = make(130, 'Task only', 'var(--coral)', 'T');
  const R = make(1010, 'With WAM hints', 'var(--green)', 'M');
  const dT = el('div', 'chip dark', '−45% time', s, 'position:absolute;left:560px;top:800px;font-size:44px;padding:10px 34px;');
  const dC = el('div', 'chip dark', '−40% calls', s, 'position:absolute;left:1010px;top:800px;font-size:44px;padding:10px 34px;');
  const fine = el('div', 'muted', 'Google Calendar workflow · Arise browser 0.1.60 · gpt-6-luna (max effort) · one run per condition · development comparison (R8)', s, 'position:absolute;left:0;right:0;top:896px;text-align:center;font-size:24px;');
  s.update = (lt) => {
    show(t, fade(lt, 0.0, 0.8), 18);
    const rate = seg(lt, 0.9, 6.4);                       // shared clock: both runs advance at the same real speed
    const elapsedL = rate * D.calendar.t;
    const elapsedR = Math.min(D.calendar.m, rate * D.calendar.t);
    L.timer.textContent = fmt1(elapsedL); R.timer.textContent = fmt1(elapsedR);
    L.fill.style.width = (elapsedL / D.calendar.t * 100) + '%'; R.fill.style.width = (elapsedR / D.calendar.t * 100) + '%';
    L.calls.textContent = Math.round(elapsedL / D.calendar.t * D.calendar.tc);
    R.calls.textContent = Math.round(Math.min(1, elapsedR / D.calendar.m) * D.calendar.mc);
    show(R.done, elapsedR >= D.calendar.m ? 1 : 0);
    show(L.done, rate >= 1 ? 1 : 0);
    show(dT, fade(lt, 7.0, 7.5), 16); show(dC, fade(lt, 7.3, 7.8), 16);
    show(fine, fade(lt, 0.8, 1.6));
  };
}

// ── S2 · problem + product + address ───────────────────
function buildS2() {
  const s = addScene('s2', { badge: 'new' });
  const A = el('div', 'abs', '', s, 'left:100px;top:170px;width:820px;');
  el('div', 'h', 'Every agent starts<br>from zero.', A, 'font-size:84px;');
  const rows = ['Monday · an agent fumbles the editor', 'Tuesday · another agent, the same fumble', 'Wednesday · and again'].map((txt, i) => {
    const r = el('div', 'card', `<span style="color:#c9553a;font-weight:800;margin-right:18px;font-size:34px">✕</span>${txt}`, A, `position:relative;margin-top:${i ? 18 : 44}px;height:92px;line-height:92px;padding:0 34px;font-size:30px;font-weight:600;`);
    r.style.position = 'relative'; return r;
  });
  const illus = el('div', 'muted', 'Illustration, not measured data', A, 'margin-top:14px;font-size:22px;');
  const B = el('div', 'abs', '', s, 'left:100px;top:210px;width:820px;opacity:0;');
  el('div', 'h', 'Web Agentic<br>Memory', B, 'font-size:112px;');
  el('div', 'muted', 'Shared memory for browser agents, read over MCP.', B, 'font-size:38px;margin-top:26px;line-height:1.3;');
  el('div', 'chip dark', 'webagenticmemory.com', B, 'font-size:50px;margin-top:40px;padding:14px 40px;');
  el('div', '', ['Muse Code', 'Claude Code', 'Codex', 'Arise'].map((h) => `<span class="chip" style="margin-right:12px">${h}</span>`).join(''), B, 'margin-top:34px;');
  const poster = el('img', '', '', s, 'position:absolute;left:1000px;top:200px;width:820px;border-radius:24px;box-shadow:0 24px 60px rgba(19,47,40,.18);border:2px solid var(--line);opacity:0;');
  poster.src = '/web/static/media/demo-compare-poster.jpg';
  const posterNote = el('div', 'muted', 'Illustrative scripted replay (demo editor) — not a measurement', s, 'position:absolute;left:1000px;top:680px;width:820px;font-size:22px;opacity:0;');
  // The real landing "quick install" block, cropped to its code panels so the commands stay readable (2360×1290 px source).
  const shot = el('div', '', '', s, 'position:absolute;left:960px;top:176px;width:880px;height:660px;overflow:hidden;border-radius:24px;border:2px solid var(--line);background:#fffef9;box-shadow:0 24px 60px rgba(19,47,40,.18);opacity:0;');
  const shotImg = el('img', '', '', shot, 'position:absolute;left:-667px;top:0;width:1573px;max-width:none;transform-origin:667px 0;');
  shotImg.src = '/demo/video/captures/landing-quick.png';
  const shotNote = el('div', 'muted', 'The real landing page · Muse Code first · public MCP endpoint', s, 'position:absolute;left:960px;top:852px;width:880px;font-size:22px;opacity:0;');
  s.update = (lt) => {
    A.style.opacity = 1 - fade(lt, 6.2, 6.8);
    rows.forEach((r, i) => show(r, fade(lt, 1.0 + i * 1.3, 1.6 + i * 1.3), 14));
    show(B, fade(lt, 6.9, 7.7), 18);
    const aPhase = 1 - fade(lt, 6.2, 6.8);
    show(poster, fade(lt, 0.9, 1.6) * aPhase, 20); posterNote.style.opacity = fade(lt, 1.2, 1.8) * aPhase;
    const p = fade(lt, 6.9, 7.8);
    show(shot, p, 24); shotImg.style.transform = `scale(${1 + 0.04 * seg(lt, 6.9, 12)})`;
    shotNote.style.opacity = p;
  };
}

// ── S3 · business workflows ────────────────────────────
function buildS3() {
  const s = addScene('s3', { badge: 'new' });
  title(s, 'Real workflows, measured on the real sites', 'left:100px;top:112px;font-size:58px;');
  const cards = [];
  const mk = (x, y, brand, persona, task, rows, deltaHtml, appear, stampText, stampAt) => {
    const c = el('div', 'card', '', s, `left:${x}px;top:${y}px;width:840px;height:300px;`);
    el('div', 'h', brand, c, 'position:absolute;left:36px;top:22px;font-size:42px;');
    el('div', 'chip', persona, c, 'position:absolute;right:30px;top:28px;font-size:20px;padding:4px 14px;');
    el('div', 'muted', task, c, 'position:absolute;left:38px;top:80px;font-size:24px;');
    const max = Math.max(...rows.map((r) => r.v));
    const three = rows.length > 2, gap = three ? 42 : 52, y0 = three ? 122 : 128;
    const b = rows.map((r, i) => {
      const ry = y0 + i * gap;
      el('div', 'muted', r.label, c, `position:absolute;left:36px;top:${ry}px;font-size:22px;width:190px;line-height:30px;`);
      const track = el('div', 'bar-track', '', c, `left:228px;top:${ry + 4}px;width:410px;height:22px;`);
      const fill = el('div', 'bar-fill', '', track, `background:${r.color};width:0;`);
      el('div', 'num', r.text, c, `position:absolute;left:652px;top:${ry - 2}px;font-size:30px;line-height:34px;`);
      return { fill, w: r.v / max * 100 };
    });
    el('div', '', deltaHtml, c, `position:absolute;left:36px;top:${three ? 252 : 246}px;font-size:26px;font-weight:700;`);
    const stamp = stampText ? el('div', 'chip coral', stampText, c, 'position:absolute;right:30px;top:248px;font-size:24px;transform:rotate(-4deg);opacity:0;') : null;
    cards.push({ c, b, appear, stamp, stampAt });
  };
  const good = (txt, sub) => `<span style="color:#2d6a3e">${txt}</span> <span class="muted" style="font-weight:500">${sub}</span>`;
  mk(100, 205, 'Canva', 'Marketing & design', 'Export page 2 as PNG and one page as PDF',
    [{ label: 'Task only', v: D.canva.t, color: 'var(--coral)', text: '474 s' }, { label: 'With WAM hints', v: D.canva.m, color: 'var(--green)', text: '423 s' }],
    good('−11% time · −14% calls', '(123 → 106 calls)'), 22.6);
  mk(980, 205, 'Google Calendar', 'Ops & assistants', 'Recurring sessions across time zones, one moved',
    [{ label: 'Task only', v: D.calendar.t, color: 'var(--coral)', text: '431 s' }, { label: 'With WAM hints', v: D.calendar.m, color: 'var(--green)', text: '237 s' }],
    good('−45% time · −40% calls', '(114 → 68 calls)'), 27.9);
  mk(100, 535, 'Notion', 'Product & knowledge work', 'Database, sort, board filter',
    [{ label: 'Task only', v: D.notion.t, color: 'var(--green)', text: '302 s' }, { label: 'Hints, try 1', v: D.notion.m1, color: 'var(--coral)', text: '375 s' }, { label: 'Hints, try 2', v: D.notion.m2, color: 'var(--coral)', text: '407 s' }],
    '<span style="color:#a8442a">+24% and +35% slower</span>', 33.9, 'NOT ADOPTED', 39.5);
  const legend = el('div', 'card', '', s, 'left:100px;top:535px;width:840px;height:300px;border-style:dashed;background:transparent;box-shadow:none;');
  el('div', 'h', 'How to read this', legend, 'position:absolute;left:36px;top:26px;font-size:40px;');
  el('div', '', '<span style="display:inline-block;width:18px;height:18px;border-radius:9px;background:var(--coral);margin-right:14px"></span>Task only: the agent gets the task and nothing else', legend, 'position:absolute;left:38px;top:98px;font-size:26px;font-weight:600;');
  el('div', '', '<span style="display:inline-block;width:18px;height:18px;border-radius:9px;background:var(--green);margin-right:14px"></span>With WAM hints: same task, hints from the shared memory', legend, 'position:absolute;left:38px;top:148px;font-size:26px;font-weight:600;');
  el('div', 'muted', 'Bars are seconds to finish. Same agent, same browser: Arise 0.1.60 with gpt-6-luna.', legend, 'position:absolute;left:38px;top:208px;width:770px;font-size:23px;line-height:1.4;');
  const c4 = el('div', 'card', '', s, 'left:980px;top:535px;width:840px;height:300px;border-style:dashed;background:transparent;box-shadow:none;');
  el('div', 'h', 'Docs · Slides · Sheets · Gmail', c4, 'position:absolute;left:36px;top:28px;font-size:42px;');
  el('div', 'muted', 'Workflows shown in look-alike demo editors', c4, 'position:absolute;left:38px;top:92px;font-size:26px;');
  el('div', 'muted', 'Scripted replay · hints are examples · no speed claim. Google Slides has not been benchmarked.', c4, 'position:absolute;left:38px;top:140px;width:760px;font-size:24px;line-height:1.45;');
  el('div', 'chip', 'Scripted demo · not measured', c4, 'position:absolute;left:36px;top:232px;font-size:26px;');
  cards.push({ c: c4, b: [], appear: 44.0 });
  const fine = el('div', 'muted', 'One run per condition · Arise browser 0.1.60 · gpt-6-luna (max effort) · development observations, not a general speed or cost claim', s, 'position:absolute;left:100px;right:100px;top:866px;text-align:center;font-size:22px;');
  s.update = (lt, t) => {
    cards.forEach((k) => {
      show(k.c, fade(t, k.appear, k.appear + 0.7), 28);
      const g = ease(seg(t, k.appear + 0.5, k.appear + 2.0));
      k.b.forEach((b) => { b.fill.style.width = (b.w * g) + '%'; });
      if (k.stamp) k.stamp.style.opacity = fade(t, k.stampAt, k.stampAt + 0.4);
    });
    show(fine, fade(lt, 0.8, 1.6));
    show(legend, fade(t, 22.9, 23.6) * (1 - fade(t, 33.0, 33.6)), 20);
  };
}

// ── S4 · contribution pipeline ─────────────────────────
function buildS4() {
  const s = addScene('s4', { badge: 'new' });
  title(s, 'How a contribution is processed', 'left:100px;top:112px;font-size:58px;');
  const nodes = [];
  const NX = [90, 543, 996, 1449];
  const defs = [

// ── terminal builder ───────────────────────────────────
function makeTerm(parent, css, titleText) {
  const t = el('div', 'term', '', parent, css);
  const bar = el('div', 'bar', '<span class="dot"></span><span class="dot"></span><span class="dot"></span>', t);
  el('span', '', esc(titleText), bar, 'margin-left:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;');
  const body = el('div', 'body', '', t);
  const lines = el('div', 'lines', '', body);
  return { t, body, lines };
}
function placeLines(term, items, lineH = 29) {
  // items: [{cls, text, at}] → creates DOM; update(t) reveals by `at` and scrolls to keep the newest line visible
  const els = items.map((it) => { const e = el('div', 'ln ' + (it.cls || ''), esc(it.text), term.lines); e.dataset.at = it.at; return e; });
  return (t, bodyH) => {
    let n = 0, y = 0, lastY = 0;
    els.forEach((e, i) => {
      const at = items[i].at;
      const a = fade(t, at, at + 0.25);
      e.style.opacity = a;
      if (a > 0) { n++; lastY = i; }
    });
    // total height of revealed lines (rows have extra margin)
    let h = 0;
    for (let i = 0; i <= lastY; i++) { if (els[i].style.opacity > 0) h += lineH + (items[i].cls && /row|cost/.test(items[i].cls) ? 8 : 0); }
    term.lines.style.transform = `translateY(${-Math.max(0, h - (bodyH - 56))}px)`;
  };
}

function parseCurate(text) {
  const out = []; let turns = 0, cost = null;
  text.split('\n').forEach((raw) => {
    if (!raw.trim()) return;
    if (raw.startsWith('scenario ')) out.push({ cls: 'head', text: raw });
    else if (raw.startsWith('    -> ')) out.push({ cls: 'call', text: raw.trim() });
    else if (raw.startsWith('    <- ')) out.push({ cls: 'res', text: raw.trim() });
    else if (raw.startsWith('model cost')) { out.push({ cls: 'cost', text: raw }); cost = raw.match(/\$([\d.]+)/)[1]; }
    else { out.push({ cls: 'row', text: raw }); const m = raw.match(/\s(\d+)\s+(PASS|FAIL)/); if (m) turns += +m[1]; }
  });
  return { lines: out, turns, cost };
}
