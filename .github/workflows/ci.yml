name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wam_ci
          POSTGRES_PASSWORD: wam_ci
          POSTGRES_DB: wam_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wam_ci -d wam_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      WAM_TEST_DATABASE_URL: postgres://wam_ci:wam_ci@127.0.0.1:5432/wam_ci
      WAM_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux secure-store build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Application database and diagnostic integration
        run: cargo test -p wam-server --locked --test postgres_application --test postgres_diagnostics -- --ignored
      - name: Queue lease, fencing and consent integration
        run: cargo test -p wam-gatekeeper --locked --test postgres_queue --test postgres_store -- --ignored
      - name: Shared quota and account erasure integration
        run: cargo test -p wam-server --locked --test rate_limit_redis --test account_cleanup -- --ignored

  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Harness, fixtures, benchmark execution and statistics
        run: python3 -B -m unittest discover -s tests/lib/selftest -t tests/lib -v
      - name: Specification test ID references
        env:
          PYTHONPATH: tests/lib
        run: |
          python3 -B - <<'PY'
          from pathlib import Path
          from wamtest.doctrace import undefined
          problems = undefined(Path("docs/spec").rglob("*.md"))
          for path, ref in problems:
              print(f"UNDEFINED {ref}: {path}")
          raise SystemExit(bool(problems))
          PY

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux secure-store build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web run test
      - run: pnpm --dir web run check
      - run: pnpm --dir web run build
      - run: pnpm --dir web exec playwright install --with-deps chrome firefox webkit
      - name: Browser engines, mobile, keyboard, accessibility and dashboard failure states
        run: pnpm --dir web run test:ui
      - name: Synthetic privacy sink collection and leak positive control
        run: pnpm --dir web run test:security
      - name: Local lifecycle and OAuth browser acceptance
        run: |
          pnpm --dir web run test:smoke
          pnpm --dir web run test:oauth
      - name: Independent browser oracle and UI drift
        run: |
          python3 -B tests/env/selfcheck.py
          python3 -B tests/env/drift_check.py
      - name: Clock, repeatability and browser action guard
        run: |
          python3 -B tests/env/repeatability_check.py --repeats 10
          python3 -B tests/env/guard_check.py
      - name: Preserve browser and fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            web/test-results/
            target/e2e-logs/
          if-no-files-found: ignore
          retention-days: 7
