name: CLI platform tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-tests:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux secure-store build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --package wam-client --package wam-cli -- --check
      - name: Lint shared client and CLI
        run: cargo clippy --locked --all-targets -p wam-client -p wam-cli -- -D warnings
      - name: Test shared client and CLI
        run: cargo test --locked -p wam-client -p wam-cli
